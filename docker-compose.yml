services:
  backend:
    build:
      context: ./backend/TeamBoard.Api
      dockerfile: Dockerfile
    container_name: teamboard-backend
    ports:
      - "5018:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./backend/TeamBoard.Api/teamboard.db:/app/teamboard.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teamboard-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend